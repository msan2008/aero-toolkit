<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #0b3a5a; font-family: system-ui, sans-serif; }
  #wrap { position: relative; }
  canvas { display: block; width: 100%; height: 340px; border-radius: 10px; }
  #replay {
    position: absolute; right: 10px; top: 10px; padding: 4px 12px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.6); background: rgba(0,0,0,.35); color: #fff;
    font-size: 13px; cursor: pointer;
  }
  #tag {
    position: absolute; left: 10px; top: 10px; padding: 3px 10px; border-radius: 999px;
    background: rgba(0,0,0,.45); color: #fff; font-size: 12px;
    max-width: calc(100% - 120px);
  }
  @media (max-width: 520px) { #tag { font-size: 10px; } #replay { font-size: 11px; padding: 3px 8px; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <span id="tag">🎮 Game animation: conceptual, not a flow simulation</span>
  <button id="replay">↻ Replay</button>
</div>
<script>
// Filled in by wing_lab.py: [{name, distance, height, x_over_c, reached, colour}]
const FLIGHTS = __FLIGHTS__;
const MAINLAND = __MAINLAND__;

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// World coordinates: metres. x from -90 (island) to 1180 (inland), y from 0 (sea) to 230.
const X0 = -90, X1 = 1180, YMAX = 230;
const SEA = () => H - 46;                       // sea level in pixels
const sx = (m) => (m - X0) / (X1 - X0) * W;
const sy = (m) => SEA() - m / YMAX * (SEA() - 30);
const LAUNCH_H = 22, LAND_H = 14;

// Flight path (game rule, conceptual): climb to the peak, then glide down.
function pathAt(f, u) {
  const end = f.reached ? LAND_H : 0;
  const x = u * f.distance;
  let y;
  if (u <= 0.3) y = LAUNCH_H + (f.height - LAUNCH_H) * Math.sin(u / 0.3 * Math.PI / 2);
  else y = end + (f.height - end) * Math.cos((u - 0.3) / 0.7 * Math.PI / 2);
  return [x, y];
}

function drawScene(t) {
  // sky
  const g = ctx.createLinearGradient(0, 0, 0, SEA());
  g.addColorStop(0, "#7cc4f2"); g.addColorStop(1, "#d8f0ff");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, SEA());
  // clouds
  ctx.fillStyle = "rgba(255,255,255,.85)";
  [[120, 40], [420, 70], [760, 35], [980, 80]].forEach(([cx, cy], i) => {
    const px = ((sx(cx) + t * 12 * (i % 2 + 1)) % (W + 120)) - 60;
    [0, 18, 36].forEach((o, k) => { ctx.beginPath(); ctx.arc(px + o, cy + (k === 1 ? -8 : 0), 16, 0, 7); ctx.fill(); });
  });
  // sea + waves
  ctx.fillStyle = "#1f78b4"; ctx.fillRect(0, SEA(), W, H - SEA());
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1.5;
  for (let row = 0; row < 3; row++) {
    ctx.beginPath();
    for (let px = 0; px <= W; px += 6) {
      const py = SEA() + 8 + row * 12 + Math.sin(px / 22 + t * 2 + row) * 2.5;
      px === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  // island
  ctx.fillStyle = "#f3d58a";
  ctx.beginPath(); ctx.moveTo(sx(-90), SEA()); ctx.quadraticCurveTo(sx(-45), sy(LAUNCH_H + 14), sx(8), SEA()); ctx.fill();
  ctx.strokeStyle = "#7a4e1d"; ctx.lineWidth = 4;              // palm
  ctx.beginPath(); ctx.moveTo(sx(-55), sy(16)); ctx.quadraticCurveTo(sx(-62), sy(45), sx(-50), sy(70)); ctx.stroke();
  ctx.fillStyle = "#2f8f46";
  for (let k = 0; k < 5; k++) {
    ctx.beginPath(); ctx.ellipse(sx(-50) + Math.cos(k * 1.3) * 14, sy(70) + Math.sin(k * 1.3) * 5, 16, 5, k * 1.3, 0, 7); ctx.fill();
  }
  // castaway (waves an arm)
  const cx = sx(-25), cy = sy(LAUNCH_H + 4);
  ctx.strokeStyle = "#333"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy - 16, 4, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - 12); ctx.lineTo(cx, cy); ctx.lineTo(cx - 4, cy + 7); ctx.moveTo(cx, cy); ctx.lineTo(cx + 4, cy + 7);
  ctx.moveTo(cx, cy - 9); ctx.lineTo(cx - 6, cy - 4);
  const a = -1.2 + Math.sin(t * 6) * 0.5; ctx.moveTo(cx, cy - 9); ctx.lineTo(cx + Math.cos(a) * 9, cy - 9 + Math.sin(a) * 9);
  ctx.stroke();
  // mainland
  ctx.fillStyle = "#5caa4f";
  ctx.beginPath(); ctx.moveTo(sx(MAINLAND - 25), SEA()); ctx.quadraticCurveTo(sx(MAINLAND), sy(LAND_H), sx(MAINLAND + 40), sy(LAND_H));
  ctx.lineTo(W, sy(LAND_H)); ctx.lineTo(W, SEA()); ctx.fill();
  ctx.fillStyle = "#a0522d"; ctx.fillRect(sx(1110), sy(LAND_H + 14), 20, sy(LAND_H) - sy(LAND_H + 14));  // hut
  ctx.fillStyle = "#c0392b"; ctx.beginPath(); ctx.moveTo(sx(1105), sy(LAND_H + 14)); ctx.lineTo(sx(1120), sy(LAND_H + 24)); ctx.lineTo(sx(1135), sy(LAND_H + 14)); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "bold " + (W < 520 ? 10 : 12) + "px system-ui"; ctx.textAlign = "right";
  ctx.fillText("MAINLAND", W - 8, sy(LAND_H) + 18);
  // distance ruler
  ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.font = "11px system-ui";
  for (let m = 0; m <= MAINLAND; m += 200) {
    ctx.fillRect(sx(m) - 0.5, H - 14, 1, 6); ctx.fillText(m + " m", sx(m), H - 2);
  }
}

function drawGlider(x, y, angle, colour) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.fillStyle = colour; ctx.strokeStyle = "#1b1b1b"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(-8, -7); ctx.lineTo(-4, 0); ctx.lineTo(-8, 7); ctx.closePath();
  ctx.fill(); ctx.stroke(); ctx.restore();
}

const DURATION = 4.2, STAGGER = 0.35;
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let start = null;

function frame(ts) {
  if (start === null) start = ts;
  const t = reduceMotion ? 99 : (ts - start) / 1000;
  drawScene(reduceMotion ? 0 : t);
  let allDone = true, anyRescue = false;
  FLIGHTS.forEach((f, i) => {
    const u = Math.max(0, Math.min(1, (t - i * STAGGER) / DURATION));
    if (u < 1) allDone = false;
    // trail
    ctx.strokeStyle = f.colour; ctx.globalAlpha = 0.55; ctx.setLineDash([5, 5]); ctx.lineWidth = 2;
    ctx.beginPath();
    for (let k = 0; k <= 60; k++) {
      const [px, py] = pathAt(f, u * k / 60);
      k === 0 ? ctx.moveTo(sx(px), sy(py)) : ctx.lineTo(sx(px), sy(py));
    }
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    const [x, y] = pathAt(f, u);
    const [x2, y2] = pathAt(f, Math.min(1, u + 0.01));
    const ang = Math.atan2(sy(y2) - sy(y), sx(x2) - sx(x) + 1e-6);
    if (u < 1) drawGlider(sx(x), sy(y), ang, f.colour);
    else {
      const since = t - i * STAGGER - DURATION;
      if (!f.reached && since < 1.4) {                 // splash ripple
        ctx.strokeStyle = "rgba(255,255,255," + (1 - since / 1.4) + ")"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(sx(x), SEA() + 3, 6 + since * 22, 2 + since * 5, 0, 0, 7); ctx.stroke();
      }
      drawGlider(sx(x), sy(y) + (f.reached ? -4 : 4), 0, f.colour);
      if (f.reached) anyRescue = true;
      // landing marker: a small coloured post with the wing's letter
      const mx = sx(x), my = f.reached ? sy(LAND_H) : SEA();
      ctx.fillStyle = f.colour; ctx.fillRect(mx - 1, my - 22 - i * 4, 2, 22 + i * 4);
      ctx.beginPath(); ctx.arc(mx, my - 26 - i * 4, 8, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold 10px system-ui"; ctx.textAlign = "center";
      ctx.fillText(f.name.slice(-1), mx, my - 22.5 - i * 4);
    }
    // legend row (fills in as each wing lands)
    const label = f.name + ": " + (u < 1 ? "flying…" : Math.round(f.distance) + " m · x/c " + f.x_over_c.toFixed(2));
    ctx.font = "bold 12px system-ui"; ctx.textAlign = "left";
    const ly = (W < 520 ? 62 : 46) + i * 21, w = ctx.measureText(label).width + 16;
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(10, ly - 14, w, 19);
    ctx.fillStyle = f.colour; ctx.fillRect(10, ly - 14, 5, 19);
    ctx.fillStyle = "#fff"; ctx.fillText(label, 20, ly);
  });
  if (allDone && anyRescue) {
    const msg = "📨 MESSAGE DELIVERED! KAI IS SAVED!";
    ctx.font = "bold 24px system-ui"; ctx.textAlign = "center";
    const mw = ctx.measureText(msg).width + 36, my = SEA() * 0.42;
    ctx.fillStyle = "rgba(20,110,60,.9)"; ctx.fillRect(W / 2 - mw / 2, my - 30, mw, 44);
    ctx.fillStyle = "#fff"; ctx.fillText(msg, W / 2, my);
  }
  if (!(allDone && t > FLIGHTS.length * STAGGER + DURATION + 1.5) || !reduceMotion) requestAnimationFrame(frame);
}
document.getElementById("replay").onclick = () => { start = null; };
requestAnimationFrame(frame);
</script>
</body>
</html>
